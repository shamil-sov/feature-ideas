  <rect x="136" y="1360" width="628" height="84" rx="30" fill="#111219" stroke="#2c2e38"/>
  <text x="178" y="1412" fill="#7c7f89" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Submission unlocks after 6 more votes</text>

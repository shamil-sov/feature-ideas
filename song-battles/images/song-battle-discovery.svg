<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" role="img" aria-labelledby="title desc">
  <title id="title">Song Battles discovery screen</title>
  <desc id="desc">A polished dark mobile app screen showing live genre song battles, progress, and navigation.</desc>
  <defs>
    <linearGradient id="phoneBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111116"/>
      <stop offset="0.55" stop-color="#0b0b10"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff453f"/>
      <stop offset="0.62" stop-color="#bd1f32"/>
      <stop offset="1" stop-color="#49172b"/>
    </linearGradient>
    <linearGradient id="coverA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b4a"/>
      <stop offset="1" stop-color="#2b1027"/>
    </linearGradient>
    <linearGradient id="coverB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f5cff"/>
      <stop offset="1" stop-color="#09213a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="900" height="1600" fill="#000"/>
  <rect x="74" y="46" width="752" height="1508" rx="82" fill="url(#phoneBg)" stroke="#343640" stroke-width="4"/>
  <rect x="104" y="82" width="692" height="1436" rx="58" fill="#09090d" stroke="#1d1e26" stroke-width="2"/>

  <text x="142" y="160" fill="#f8f8fb" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="750">9:41</text>
  <rect x="368" y="118" width="164" height="48" rx="24" fill="#000"/>
  <rect x="690" y="134" width="48" height="26" rx="8" fill="none" stroke="#fff" stroke-width="4"/>
  <rect x="743" y="143" width="5" height="9" rx="2" fill="#fff"/>
  <rect x="704" y="142" width="20" height="10" rx="2" fill="#fff"/>

  <text x="136" y="278" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="60" font-weight="850">Song Battles</text>
  <text x="138" y="328" fill="#a9abb5" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="500">Live genre competitions for creators.</text>

  <rect x="136" y="374" width="628" height="64" rx="32" fill="#171821" stroke="#2c2e38"/>
  <rect x="146" y="384" width="168" height="44" rx="22" fill="#ff453f"/>
  <text x="202" y="413" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850">Live</text>
  <text x="382" y="413" fill="#bec0c8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750">Ending soon</text>
  <text x="608" y="413" fill="#7c7f89" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750">Winners</text>

  <g filter="url(#shadow)">
    <rect x="136" y="480" width="628" height="252" rx="34" fill="url(#hero)"/>
    <text x="178" y="552" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="850">Hip-Hop Battle</text>
    <text x="178" y="594" fill="#ffd4d2" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="650">312 tracks - round ends in 14h</text>
    <rect x="178" y="630" width="260" height="14" rx="7" fill="#fff" fill-opacity="0.22"/>
    <rect x="178" y="630" width="182" height="14" rx="7" fill="#fff"/>
    <text x="178" y="684" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="750">4/10 votes completed</text>
    <rect x="548" y="626" width="154" height="62" rx="31" fill="#fff" fill-opacity="0.18"/>
    <text x="586" y="665" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="850">Vote now</text>
  </g>

  <text x="136" y="804" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="850">Browse battles</text>
  <text x="616" y="804" fill="#ff5a5f" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750">See all</text>

  <rect x="136" y="838" width="294" height="178" rx="28" fill="#171821" stroke="#2c2e38"/>
  <circle cx="190" cy="904" r="34" fill="url(#coverA)"/>
  <text x="244" y="900" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="850">Rock</text>
  <text x="244" y="935" fill="#a9abb5" font-family="Inter, Arial, sans-serif" font-size="19">118 tracks</text>
  <text x="170" y="982" fill="#ff5a5f" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750">2 days left</text>

  <rect x="470" y="838" width="294" height="178" rx="28" fill="#171821" stroke="#2c2e38"/>
  <circle cx="524" cy="904" r="34" fill="url(#coverB)"/>
  <text x="578" y="900" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="850">Electronic</text>
  <text x="578" y="935" fill="#a9abb5" font-family="Inter, Arial, sans-serif" font-size="19">96 tracks</text>
  <text x="504" y="982" fill="#ff5a5f" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750">1 day left</text>

  <rect x="136" y="1048" width="628" height="150" rx="30" fill="#12131a" stroke="#2c2e38"/>
  <text x="178" y="1104" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="850">Top track right now</text>
  <text x="178" y="1142" fill="#a9abb5" font-family="Inter, Arial, sans-serif" font-size="21">Neon Signal - 82% win rate</text>
  <rect x="580" y="1090" width="112" height="52" rx="26" fill="#20222c"/>
  <text x="613" y="1124" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Open</text>

  <rect x="104" y="1380" width="692" height="138" rx="38" fill="#0f1016" stroke="#22232b"/>
  <text x="156" y="1438" fill="#777a84" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750">Home</text>
  <circle cx="312" cy="1425" r="18" fill="#ff453f"/>
  <text x="282" y="1472" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850">Battles</text>
  <text x="466" y="1438" fill="#777a84" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750">Feed</text>
  <text x="624" y="1438" fill="#777a84" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750">Profile</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" role="img" aria-labelledby="title desc">
  <title id="title">Song Battles voter recognition screen</title>
  <desc id="desc">A polished dark mobile app screen showing top voters, streaks, and listener badges.</desc>
  <defs>
    <linearGradient id="phoneBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111116"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="avatar1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff453f"/>
      <stop offset="1" stop-color="#5a1733"/>
    </linearGradient>
    <linearGradient id="avatar2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35e38b"/>
      <stop offset="1" stop-color="#123d2b"/>
    </linearGradient>
    <linearGradient id="avatar3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#1a1838"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1600" fill="#000"/>
  <rect x="74" y="46" width="752" height="1508" rx="82" fill="url(#phoneBg)" stroke="#343640" stroke-width="4"/>
  <rect x="104" y="82" width="692" height="1436" rx="58" fill="#09090d" stroke="#1d1e26" stroke-width="2"/>
  <text x="142" y="160" fill="#f8f8fb" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="750">9:41</text>
  <text x="136" y="286" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="850">Top voters</text>
  <text x="138" y="336" fill="#a9abb5" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="500">Reward listeners who keep battles moving.</text>

  <rect x="136" y="394" width="628" height="168" rx="34" fill="#1d1420" stroke="#ff453f"/>
  <circle cx="208" cy="478" r="44" fill="url(#avatar1)"/>
  <text x="282" y="462" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="850">You</text>
  <text x="282" y="502" fill="#a9abb5" font-family="Inter, Arial, sans-serif" font-size="22">42 votes - 5 day streak</text>
  <rect x="606" y="448" width="90" height="58" rx="29" fill="#ff453f"/>
  <text x="632" y="486" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="850">#8</text>

  <text x="136" y="636" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="850">This round</text>
  <rect x="136" y="676" width="628" height="112" rx="26" fill="#171821" stroke="#2c2e38"/>
  <circle cx="196" cy="732" r="34" fill="url(#avatar2)"/>
  <text x="250" y="724" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="850">#1 Maya K.</text>
  <text x="250" y="758" fill="#a9abb5" font-family="Inter, Arial, sans-serif" font-size="19">128 votes</text>
  <text x="628" y="744" fill="#35e38b" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="850">+18</text>

  <rect x="136" y="816" width="628" height="112" rx="26" fill="#171821" stroke="#2c2e38"/>
  <circle cx="196" cy="872" r="34" fill="url(#avatar3)"/>
  <text x="250" y="864" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="850">#2 ToneLab</text>
  <text x="250" y="898" fill="#a9abb5" font-family="Inter, Arial, sans-serif" font-size="19">101 votes</text>
  <text x="628" y="884" fill="#35e38b" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="850">+7</text>

  <rect x="136" y="956" width="628" height="112" rx="26" fill="#171821" stroke="#2c2e38"/>
  <circle cx="196" cy="1012" r="34" fill="#30323b"/>
  <text x="250" y="1004" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="850">#3 Nova</text>
  <text x="250" y="1038" fill="#a9abb5" font-family="Inter, Arial, sans-serif" font-size="19">96 votes</text>
  <text x="628" y="1024" fill="#bec0c8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="850">-</text>

  <rect x="136" y="1146" width="628" height="158" rx="30" fill="#12131a" stroke="#2c2e38"/>
  <text x="178" y="1204" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="850">Active Supporter badge</text>
  <text x="178" y="1244" fill="#a9abb5" font-family="Inter, Arial, sans-serif" font-size="21">Profile badge for active listeners.</text>
  <rect x="586" y="1196" width="112" height="52" rx="26" fill="#20222c"/>
  <text x="616" y="1230" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">View</text>
</svg>

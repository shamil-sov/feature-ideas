  <text x="178" y="616" fill="#ffd5d5" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="650">One-day round - 312 tracks</text>
  <text x="626" y="596" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="850">14h</text>

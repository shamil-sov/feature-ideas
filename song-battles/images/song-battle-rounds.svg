  <text x="136" y="800" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="850">Other active rounds</text>
  <rect x="136" y="836" width="628" height="132" rx="28" fill="#171821" stroke="#2c2e38"/>
  <text x="178" y="892" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="850">Rock Battle</text>
  <text x="178" y="930" fill="#a9abb5" font-family="Inter, Arial, sans-serif" font-size="21">Two-day round - 118 tracks</text>
  <text x="624" y="912" fill="#bec0c8" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="850">1d 8h</text>


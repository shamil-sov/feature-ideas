<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" role="img" aria-labelledby="title desc">
  <title id="title">Song Battles community screen</title>
  <desc id="desc">A polished dark mobile app screen showing battle discussion, reactions, and comments.</desc>
  <defs>

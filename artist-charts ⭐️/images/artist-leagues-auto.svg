<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" role="img" aria-labelledby="title desc">
  <title id="title">Artist Charts automatic league placement</title>
  <desc id="desc">A dark mobile UI mockup showing that an artist is automatically placed into the Breakthrough League based on follower count.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090d"/>
      <stop offset="0.55" stop-color="#101018"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191823"/>
      <stop offset="1" stop-color="#0e0e14"/>
    </linearGradient>
    <linearGradient id="current" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2038"/>
      <stop offset="1" stop-color="#15101f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="900" height="1600" fill="#000"/>
  <rect x="76" y="54" width="748" height="1492" rx="86" fill="url(#bg)" stroke="#2f3038" stroke-width="4"/>
  <rect x="104" y="82" width="692" height="1436" rx="64" fill="#0b0b10" stroke="#181922" stroke-width="2"/>

  <text x="152" y="165" fill="#f7f7fb" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="700">9:41</text>
  <rect x="364" y="123" width="172" height="50" rx="25" fill="#000"/>
  <circle cx="508" cy="148" r="8" fill="#121829"/>
  <rect x="676" y="136" width="45" height="26" rx="8" fill="none" stroke="#f4f4f6" stroke-width="4"/>
  <rect x="724" y="144" width="5" height="10" rx="3" fill="#f4f4f6"/>
  <rect x="690" y="144" width="18" height="10" rx="2" fill="#f4f4f6"/>

  <text x="138" y="286" fill="#f7f7fb" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="800">Your league</text>
  <text x="138" y="346" fill="#a8aab4" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="500">Set automatically from follower count</text>

  <g filter="url(#shadow)">
    <rect x="132" y="408" width="636" height="236" rx="34" fill="url(#current)" stroke="#bd5cff" stroke-width="3"/>
    <text x="176" y="492" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="43" font-weight="800">Breakthrough League</text>
    <text x="176" y="544" fill="#c4c3cc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="500">1K-9,999 followers</text>
    <rect x="176" y="574" width="160" height="42" rx="21" fill="#bd5cff" fill-opacity="0.18" stroke="#bd5cff" stroke-opacity="0.7"/>
    <text x="202" y="603" fill="#e5c6ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Auto placed</text>
    <circle cx="696" cy="526" r="32" fill="#bd5cff" fill-opacity="0.16"/>
    <path d="M681 526l10 11 25-29" fill="none" stroke="#d78aff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="132" y="704" width="636" height="116" rx="24" fill="url(#card)" stroke="#2b2c34"/>
  <text x="176" y="758" fill="#f2f2f5" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="750">Starter League</text>
  <text x="176" y="793" fill="#a7a8b0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="500">Under 100 followers</text>

  <rect x="132" y="846" width="636" height="116" rx="24" fill="url(#card)" stroke="#2b2c34"/>
  <text x="176" y="900" fill="#f2f2f5" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="750">Emerging League</text>
  <text x="176" y="935" fill="#a7a8b0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="500">100-999 followers</text>

  <rect x="132" y="988" width="636" height="116" rx="24" fill="url(#card)" stroke="#2b2c34"/>
  <text x="176" y="1042" fill="#f2f2f5" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="750">Established League</text>
  <text x="176" y="1077" fill="#a7a8b0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="500">10K-99,999 followers</text>

  <rect x="132" y="1130" width="636" height="116" rx="24" fill="url(#card)" stroke="#2b2c34"/>
  <text x="176" y="1184" fill="#f2f2f5" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="750">Headliner League</text>
  <text x="176" y="1219" fill="#a7a8b0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="500">100K+ followers</text>

  <rect x="170" y="1315" width="560" height="86" rx="43" fill="#15151d" stroke="#2b2c34"/>
  <text x="234" y="1368" fill="#c8c9d1" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">1,420 followers today</text>
  <circle cx="199" cy="1358" r="9" fill="#bd5cff"/>
</svg>
